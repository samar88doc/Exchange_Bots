[project]
name = "shasha-act"
version = "0.1.0"
description = "PAPER-first TradingView SHASHA automation for Shark Exchange"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "SQLAlchemy[asyncio]>=2.0.30,<3",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "python-socketio[asyncio_client]>=5.11,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
