# Fly.io configuration for Shark Automate backend
app = "shark-automate-api"
primary_region = "sin"  # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # IMPORTANT: keep alive for trading bot
  auto_start_machines = true
  min_machines_running = 1     # always at least 1 machine running

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  REDIS_ENABLED = "false"
  # Update this after Vercel deploy gives you the real URL:
  CORS_ORIGINS = "https://shark-automate.vercel.app,https://shark-automate-api.fly.dev"
